services:
  web:
    image: python:3.12-slim
    container_name: memoria-escola-web
    restart: on-failure
    labels:
      base44.project: "Memória Escola"
      base44.kind: web
      base44.port: "3000"
    working_dir: /srv/app
    command:
      - python
      - -m
      - http.server
      - "3000"
      - --bind
      - 0.0.0.0
      - --directory
      - /srv/app
    ports:
      - "3000:3000"
    volumes:
      - ./:/srv/app:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/').status == 200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
